    --ochre:#C99A44;
    --ochre-dim:#EADCC0;
    --green:#3F7D58;
    --green-dim:#E3EFE7;
    --red:#A63D40;
    --red-dim:#F4E3E2;
    --ink:#1E2430;
    --ink-soft:#5B6270;
    --line:#DEDACB;
    --radius:14px;
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:720px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:0 0 40px;
  }

  header.top{
    background:var(--navy);
    color:#fff;
    padding:22px 20px 18px;
    border-bottom:4px solid var(--ochre);
  }
  header.top .brand{
    font-family:var(--serif);
    font-size:22px;
    font-weight:600;
    letter-spacing:0.2px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  header.top .brand small{
    font-family:var(--sans);
    font-size:12px;
    font-weight:500;
    color:var(--ochre);
    text-transform:none;
  }
  header.top .sub{
    font-size:13px;
    color:#B9C2D6;
    margin-top:4px;
  }

  .teil-tabs{
    display:flex;
    gap:6px;
    padding:14px 16px;
    overflow-x:auto;
    background:var(--paper-dim);
    border-bottom:1px solid var(--line);
  }
  .teil-tab{
    flex:0 0 auto;
    padding:9px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .teil-tab.active{
    background:var(--navy);
    border-color:var(--navy);
    color:#fff;
  }
  .teil-tab .pct{
    font-weight:500;
    opacity:.75;
    margin-left:5px;
    font-size:11px;
  }

  main{
    flex:1;
    padding:22px 18px 10px;
  }

  .home-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:14px;
  }
  .home-card h2{
    font-family:var(--serif);
    font-size:19px;
    margin:0 0 6px;
  }
  .home-card p{
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.55;
    margin:0 0 14px;
  }
  .home-teil-list{
    display:grid;
    gap:10px;
  }
  .home-teil-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    background:var(--paper-dim);
    border-radius:10px;
    cursor:pointer;
    border:1px solid transparent;
    transition:border-color .15s ease;
  }
  .home-teil-row:hover{border-color:var(--ochre);}
  .home-teil-row .name{font-weight:700; font-size:14.5px;}
  .home-teil-row .desc{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .home-teil-row .badge{
    font-size:12px;
    font-weight:700;
    color:var(--navy);
    background:var(--ochre-dim);
    padding:4px 10px;
    border-radius:999px;
    flex:0 0 auto;
  }

  .progress-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .progress-track{
    flex:1;
    height:8px;
    background:var(--paper-dim);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--ochre);
    border-radius:999px;
    transition:width .3s ease;
  }
  .progress-label{
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    flex:0 0 auto;
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:600;
    color:var(--navy);
    background:none;
    border:none;
    cursor:pointer;
    padding:0 0 14px;
  }

  .qcard{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:16px;
  }
  .thema-tag{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    color:var(--navy);
    background:var(--ochre-dim);
    padding:5px 11px;
    border-radius:999px;
    margin-bottom:14px;
  }
  .qtext{
    font-family:var(--serif);
    font-size:18px;
    line-height:1.5;
    font-weight:600;
    color:var(--ink);
    margin:0 0 4px;
  }
  .qhint{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }

  .options{display:grid; gap:10px; margin-top:14px;}
  .option{
    text-align:right;
    padding:13px 16px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--paper);
    font-size:14.5px;
    cursor:pointer;
    transition:all .12s ease;
    font-family:var(--sans);
    color:var(--ink);
  }
  .option:hover{border-color:var(--ochre);}
  .option.correct{background:var(--green-dim); border-color:var(--green); color:#20452F;}
  .option.wrong{background:var(--red-dim); border-color:var(--red); color:#5C2224;}
  .option.disabled{pointer-events:none; opacity:.65;}
  .option.disabled.correct, .option.disabled.wrong{opacity:1;}

  .order-list{display:grid; gap:9px; margin-top:10px;}
  .order-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--paper);
    font-size:14px;
    cursor:grab;
    user-select:none;
  }
  .order-item.dragging{opacity:.4;}
  .order-item .num{
    flex:0 0 auto;
    width:24px; height:24px;
    border-radius:50%;
    background:var(--navy);
    color:#fff;
    font-size:12px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .order-item.correct{background:var(--green-dim); border-color:var(--green);}
  .order-item.wrong{background:var(--red-dim); border-color:var(--red);}
  .drag-handle{margin-inline-start:auto; color:var(--ink-soft); font-size:16px; flex:0 0 auto;}

  .match-cols{display:flex; gap:10px; margin-top:10px;}
  .match-col{flex:1; display:grid; gap:9px; min-width:0;}
  .match-item{
    padding:11px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--paper);
    font-size:13px;
    line-height:1.4;
    cursor:pointer;
    transition:all .12s ease;
    min-height:52px;
    display:flex;
    align-items:center;
  }
  .match-item.selected{border-color:var(--navy); background:var(--ochre-dim);}
  .match-item.matched-correct{background:var(--green-dim); border-color:var(--green); pointer-events:none;}
  .match-item.matched-wrong{background:var(--red-dim); border-color:var(--red);}
  .match-item.used{opacity:.4; pointer-events:none;}

  .ms-grid{display:grid; gap:9px; margin-top:10px;}
  .ms-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--paper);
    font-size:14px;
    cursor:pointer;
  }
  .ms-item .order-badge{
    flex:0 0 auto;
    width:24px; height:24px;
    border-radius:50%;
    border:1.5px solid var(--ink-soft);
    color:var(--ink-soft);
    font-size:12px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ms-item.picked .order-badge{background:var(--navy); border-color:var(--navy); color:#fff;}
  .ms-item.correct{background:var(--green-dim); border-color:var(--green);}
  .ms-item.wrong{background:var(--red-dim); border-color:var(--red);}
  .ms-item.disabled{pointer-events:none;}

  .legend-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
    gap:8px;
    margin:12px 0 18px;

  .legend-card{
    display:flex;
    align-items:flex-start;
    gap:9px;
    padding:10px 12px;

    border-radius:10px;
    border:1.5px solid var(--line);

    font-size:12.5px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:1px;

  .legend-kw{font-size:12.5px; font-weight:400; color:var(--ink-soft);}
  .t1-row{
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .t1-row:last-child{border-bottom:none;}
  .t1-qtext{
    font-size:14.5px;
    line-height:1.5;
    margin:0 0 10px;
    font-weight:500;
  }
  .t1-choices{display:flex; gap:8px; flex-wrap:wrap;}
  .t1-choice{
    flex:0 0 auto;
    min-width:44px;
    padding:9px 0;
    text-align:center;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--paper);
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    color:var(--ink);
  }
  .t1-choice.correct{background:var(--green-dim); border-color:var(--green); color:#20452F;}
  .t1-choice.wrong{background:var(--red-dim); border-color:var(--red); color:#5C2224;}
  .t1-choice.disabled{pointer-events:none; opacity:.7;}
  .t1-choice.disabled.correct, .t1-choice.disabled.wrong{opacity:1;}

  .controls{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .btn{
    flex:1;
    padding:13px 16px;
    border-radius:10px;
    border:none;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    font-family:var(--sans);
  }
  .btn-primary{background:var(--navy); color:#fff;}
  .btn-primary:disabled{background:#B8BEC9; cursor:not-allowed;}
  .btn-ghost{background:var(--paper-dim); color:var(--ink); border:1px solid var(--line);}

  .feedback{
    margin-top:14px;
    padding:12px 14px;
    border-radius:10px;
    font-size:13.5px;
    line-height:1.5;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.ok{background:var(--green-dim); color:#20452F;}
  .feedback.bad{background:var(--red-dim); color:#5C2224;}

  .result-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:30px 24px;
    text-align:center;
  }
  .result-card .big{
    font-family:var(--serif);
    font-size:44px;
    font-weight:700;
    color:var(--navy);
    margin:6px 0 2px;
  }
  .result-card .label{
    color:var(--ink-soft);
    font-size:14px;
    margin-bottom:20px;
  }

  ::-webkit-scrollbar{height:6px; width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

  @media (max-width:480px){
    .qtext{font-size:16.5px;}
    .match-item{font-size:12.5px; padding:10px;}
  }
</style>
</head>

const TEIL_META = [
  {key:"teil1", label:"Teil 1", desc:"Wer sagt was? — A/B/C/D"},
  {key:"teil2", label:"Teil 2", desc:"Reihenfolge — Drag & Drop"},
  {key:"teil3", label:"Teil 3", desc:"Zuordnung — 3 Antworten"},
  {key:"teil4", label:"Teil 4", desc:"Zuordnen — Aussage & Person"},
  {key:"teil5", label:"Teil 5", desc:"3 Punkte — richtige Reihenfolge"}
];

/* =========================================================
   STATE
========================================================= */
let state = {
  view: "home",
  teilKey: null,
  itemIndex: 0,
  score: 0,
  total: 0,
  answered: false
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function saveProgress(teilKey, pct){
  try{ localStorage.setItem("b2v2_"+teilKey, pct); }catch(e){}
}
function loadProgress(teilKey){
  try{ return parseInt(localStorage.getItem("b2v2_"+teilKey) || "0"); }catch(e){ return 0; }
}

function buildRounds(teilKey){
  const themen = DATA[teilKey];
  if(teilKey === "teil1"){
    return themen.map(t => ({thema:t.thema, persons:t.persons, keywords:t.keywords, questions:t.questions}));
  }
  const rounds = [];
  if(teilKey === "teil3"){
    themen.forEach(t => t.questions.forEach(q => rounds.push({thema:t.thema, ...q})));
  } else if(teilKey === "teil2"){
    themen.forEach(t => rounds.push({thema:t.thema, items:t.items}));
  } else if(teilKey === "teil4"){
    themen.forEach(t => rounds.push({thema:t.thema, pairs:t.pairs}));
  } else if(teilKey === "teil5"){
    themen.forEach(t => rounds.push({thema:t.thema, items:t.correct}));
  }
  return rounds;
}

function countUnits(teilKey){
  const themen = DATA[teilKey];
  if(teilKey === "teil1") return themen.reduce((s,t)=>s+t.questions.length,0);
  return buildRounds(teilKey).length;
}

/* =========================================================
   RENDER: shell (tabs)
========================================================= */
function renderTabs(){
  const wrap = document.getElementById("teilTabs");
  wrap.innerHTML = "";
  const homeBtn = document.createElement("button");
  homeBtn.className = "teil-tab" + (state.view==="home" ? " active" : "");
  homeBtn.textContent = "Start";
  homeBtn.onclick = () => goHome();
  wrap.appendChild(homeBtn);

  TEIL_META.forEach(tm => {
    const pct = loadProgress(tm.key);
    const b = document.createElement("button");
    b.className = "teil-tab" + (state.teilKey===tm.key && state.view==="teil" ? " active" : "");
    b.innerHTML = tm.label + (pct ? `<span class="pct">${pct}%</span>` : "");
    b.onclick = () => startTeil(tm.key);
    wrap.appendChild(b);
  });
}

function goHome(){
  state.view = "home";
  renderTabs();
  renderHome();
}

function renderHome(){
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="home-card">
      <h2>Wähle einen Teil</h2>
      <p>Fünf Übungsformen wie im Goethe-Zertifikat B2, Leseverstehen. Wähle einen Teil, um zu starten.</p>
      <div class="home-teil-list" id="homeList"></div>
    </div>
  `;
  const list = document.getElementById("homeList");
  TEIL_META.forEach(tm => {
    const n = countUnits(tm.key);
    const pct = loadProgress(tm.key);
    const row = document.createElement("div");
    row.className = "home-teil-row";
    row.innerHTML = `
      <div>
        <div class="name">${tm.label}</div>
        <div class="desc">${tm.desc} · ${n} Aufgaben</div>
      </div>
      <div class="badge">${pct ? pct+"%" : "Start"}</div>
    `;
    row.onclick = () => startTeil(tm.key);
    list.appendChild(row);
  });
}

/* =========================================================
   TEIL RUNNER
========================================================= */
function startTeil(teilKey){
  state.view = "teil";
  state.teilKey = teilKey;
  state.rounds = buildRounds(teilKey);
  state.itemIndex = 0;
  state.score = 0;
  state.total = state.rounds.length;
  state.subScore = 0;
  state.subTotal = 0;
  state.answered = false;
  renderTabs();
  renderRound();
}

function progressPct(){
  return Math.round((state.itemIndex/state.total)*100);
}

function renderProgressBar(){
  const label = state.teilKey === "teil1" ? "Thema" : "Aufgabe";
  return `
    <button class="back-link" onclick="goHome()">‹ Zur Übersicht</button>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct()}%"></div></div>
      <div class="progress-label">${label} ${state.itemIndex}/${state.total}</div>
    </div>
  `;
}

function nextRound(){
  state.itemIndex++;
  state.answered = false;
  if(state.itemIndex >= state.total){
    let pct;
    if(state.teilKey === "teil1"){
      pct = Math.round((state.subScore/state.subTotal)*100);
    } else {
      pct = Math.round((state.score/state.total)*100);
    }
    saveProgress(state.teilKey, pct);
    renderTabs();
    renderResult(pct);
  } else {
    renderRound();
  }
}

function renderResult(pct){
  const meta = TEIL_META.find(t=>t.key===state.teilKey);
  const main = document.getElementById("main");
  const label = state.teilKey === "teil1" ? `${state.subScore} von ${state.subTotal} richtig` : `${state.score} von ${state.total} richtig`;
  main.innerHTML = `
    ${renderProgressBar()}
    <div class="result-card">
      <div style="font-size:13px;color:var(--ink-soft);font-weight:600;">${meta.label} abgeschlossen</div>
      <div class="big">${pct}%</div>
      <div class="label">${label}</div>
      <div class="controls">
        <button class="btn btn-ghost" onclick="goHome()">Zur Übersicht</button>
        <button class="btn btn-primary" onclick="startTeil('${state.teilKey}')">Nochmal üben</button>
      </div>
    </div>
  `;
}

function renderRound(){
  const round = state.rounds[state.itemIndex];
  const teilKey = state.teilKey;
  if(teilKey === "teil1") renderTeil1(round);
  else if(teilKey === "teil2") renderOrdering(round);
  else if(teilKey === "teil3") renderMCQ(round, 3);
  else if(teilKey === "teil4") renderMatching(round);
  else if(teilKey === "teil5") renderOrdering(round);
}

/* ---------- TEIL 1: Wer sagt was? (A/B/C/D) ---------- */
function renderTeil1(round){
  const letters = ["A","B","C","D","E","F"];
  const main = document.getElementById("main");
  const legendHtml = round.persons.map((name,i) => `
    <div class="legend-card">
      <span class="legend-letter">${letters[i]}</span>
      <span class="legend-name">${name}<br><span class="legend-kw">${round.keywords[i]}</span></span>
    </div>
  `).join("");

  main.innerHTML = `
    ${renderProgressBar()}
    <div class="qcard">
      <span class="thema-tag">${round.thema}</span>
      <p class="qtext" style="font-size:15.5px;">Wer sagt was? Ordne jede Aussage der richtigen Person zu.</p>
      <div class="legend-grid">${legendHtml}</div>
      <div id="t1Rows"></div>
      <div class="feedback" id="fb"></div>
      <div class="controls" style="margin-top:16px;">
        <button class="btn btn-primary" id="nextBtn" disabled onclick="nextRound()">Weiter</button>
      </div>
    </div>
  `;

  state._t1Questions = shuffle(round.questions);
  state._t1AnsweredCount = 0;
  state._t1PersonCount = round.persons.length;
  state.subTotal += state._t1Questions.length;
  renderT1Rows(letters);
}

function renderT1Rows(letters){
  const wrap = document.getElementById("t1Rows");
  wrap.innerHTML = "";
  state._t1Questions.forEach((q, idx) => {
    const row = document.createElement("div");
    row.className = "t1-row";
    const choicesHtml = state._t1Questions[idx]._letters === undefined ? "" : "";
    row.innerHTML = `<p class="t1-qtext">${q.q}</p><div class="t1-choices" id="t1choices-${idx}"></div>`;
    wrap.appendChild(row);
    const choicesDiv = row.querySelector(`#t1choices-${idx}`);
    for(let i=0;i<state._t1PersonCount;i++){
      const btn = document.createElement("button");
      btn.className = "t1-choice";
      btn.textContent = letters[i];
      btn.onclick = () => {
        if(btn.classList.contains("disabled")) return;
        const isCorrect = i === q.p;
        if(isCorrect) state.subScore++;
        const allBtns = choicesDiv.querySelectorAll(".t1-choice");
        allBtns.forEach((b, bi) => {
          b.classList.add("disabled");
          if(bi === q.p) b.classList.add("correct");
          else if(bi === i) b.classList.add("wrong");
        });
        state._t1AnsweredCount++;
        if(state._t1AnsweredCount === state._t1Questions.length){
          document.getElementById("nextBtn").disabled = false;
          const fb = document.getElementById("fb");
          fb.className = "feedback show ok";
          fb.textContent = "Thema abgeschlossen — weiter zum nächsten Thema.";
        }
      };
      choicesDiv.appendChild(btn);
    }
  });
}

/* ---------- TEIL 3: MCQ (3 options) ---------- */
function renderMCQ(round, totalOptions){
  const wrongPool = round.wrong.slice(0, totalOptions-1);
  const options = shuffle([round.correct, ...wrongPool]);
  const main = document.getElementById("main");
  const qtext = round.q || round.stem;
  main.innerHTML = `
    ${renderProgressBar()}
    <div class="qcard">
      <span class="thema-tag">${round.thema}</span>
      <p class="qtext">${qtext}</p>
      <div class="options" id="opts"></div>
      <div class="feedback" id="fb"></div>
      <div class="controls" style="margin-top:16px;">
        <button class="btn btn-primary" id="nextBtn" disabled onclick="nextRound()">Weiter</button>
      </div>
    </div>
  `;
  const optWrap = document.getElementById("opts");
  options.forEach(optText => {
    const el = document.createElement("button");
    el.className = "option";
    el.textContent = optText;
    el.onclick = () => {
      if(state.answered) return;
      state.answered = true;
      const isCorrect = optText === round.correct;
      if(isCorrect) state.score++;
      [...optWrap.children].forEach(c => {
        c.classList.add("disabled");
        if(c.textContent === round.correct) c.classList.add("correct");
        else if(c===el) c.classList.add("wrong");
      });
      const fb = document.getElementById("fb");
      fb.className = "feedback show " + (isCorrect ? "ok" : "bad");
      fb.textContent = isCorrect ? "Richtig!" : "Nicht ganz — richtig ist: " + round.correct;
      document.getElementById("nextBtn").disabled = false;
    };
    optWrap.appendChild(el);
  });
}

/* ---------- TEIL 2: Ordering (drag & drop) ---------- */
function renderOrdering(round){
  const correctOrder = round.items;
  const shuffled = shuffle(correctOrder.map((text,i)=>({text, origIndex:i})));
  const main = document.getElementById("main");
  main.innerHTML = `
    ${renderProgressBar()}
    <div class="qcard">
      <span class="thema-tag">${round.thema}</span>
      <p class="qtext">Bringe die Elemente in die richtige Reihenfolge.</p>
      <p class="qhint">Ziehe die Karten per Drag & Drop, um sie neu anzuordnen.</p>
      <div class="order-list" id="orderList"></div>
      <div class="feedback" id="fb"></div>
      <div class="controls" style="margin-top:16px;">
        <button class="btn btn-ghost" id="checkBtn" onclick="checkOrder()">Prüfen</button>
        <button class="btn btn-primary" id="nextBtn" disabled onclick="nextRound()">Weiter</button>
      </div>
    </div>
  `;
  state._orderData = shuffled;
  state._orderCorrect = correctOrder;
  renderOrderList();
}

function renderOrderList(){
  const list = document.getElementById("orderList");
  list.innerHTML = "";
  state._orderData.forEach((item, idx) => {
    const el = document.createElement("div");
    el.className = "order-item";
    el.draggable = true;
    el.dataset.idx = idx;
    el.innerHTML = `<span class="num">${idx+1}</span><span>${item.text}</span><span class="drag-handle">⠿</span>`;
    el.addEventListener("dragstart", e => {
      el.classList.add("dragging");
      e.dataTransfer.setData("text/plain", idx);
    });
    el.addEventListener("dragend", () => el.classList.remove("dragging"));
    el.addEventListener("dragover", e => e.preventDefault());
    el.addEventListener("drop", e => {
      e.preventDefault();
      const fromIdx = parseInt(e.dataTransfer.getData("text/plain"));
      const toIdx = parseInt(el.dataset.idx);
      if(fromIdx === toIdx) return;
      const moved = state._orderData.splice(fromIdx,1)[0];
      state._orderData.splice(toIdx,0,moved);
      renderOrderList();
    });
    list.appendChild(el);
  });
}

function checkOrder(){
  if(state.answered) return;
  state.answered = true;
  const userOrder = state._orderData.map(x=>x.text);
  const isCorrect = JSON.stringify(userOrder) === JSON.stringify(state._orderCorrect);
  if(isCorrect) state.score++;
  const items = document.querySelectorAll("#orderList .order-item");
  items.forEach((el, i) => {
    el.draggable = false;
    if(userOrder[i] === state._orderCorrect[i]) el.classList.add("correct");
    else el.classList.add("wrong");
  });
  const fb = document.getElementById("fb");
  fb.className = "feedback show " + (isCorrect ? "ok" : "bad");
  fb.textContent = isCorrect ? "Richtig! Die Reihenfolge stimmt." : "Nicht ganz. Richtige Reihenfolge: " + state._orderCorrect.map((t,i)=>(i+1)+". "+t).join(" ");
  document.getElementById("checkBtn").disabled = true;
  document.getElementById("nextBtn").disabled = false;
}

/* ---------- TEIL 4: Matching (tap-to-match) ---------- */
function renderMatching(round){
  const pairs = round.pairs;
  const leftItems = pairs.map((p,i)=>({text:p.a, id:i}));
  const rightItems = shuffle(pairs.map((p,i)=>({text:p.b, id:i})));
  const main = document.getElementById("main");
  main.innerHTML = `
    ${renderProgressBar()}
    <div class="qcard">
      <span class="thema-tag">${round.thema}</span>
      <p class="qtext">Ordne jede Aussage der passenden Person zu.</p>
      <p class="qhint">Tippe zuerst auf eine Aussage links, dann auf die passende Person rechts.</p>
      <div class="match-cols">
        <div class="match-col" id="leftCol"></div>
        <div class="match-col" id="rightCol"></div>
      </div>
      <div class="feedback" id="fb"></div>
      <div class="controls" style="margin-top:16px;">
        <button class="btn btn-primary" id="nextBtn" disabled onclick="nextRound()">Weiter</button>
      </div>
    </div>
  `;
  state._matchLeft = leftItems;
  state._matchRight = rightItems;
  state._matchSelectedLeft = null;
  state._matchCorrectCount = 0;
  state._matchTotal = pairs.length;
  state._matchWrongOnce = false;
  renderMatchCols();
}

function renderMatchCols(){
  const left = document.getElementById("leftCol");
  const right = document.getElementById("rightCol");
  left.innerHTML = "";
  right.innerHTML = "";
  state._matchLeft.forEach(item => {
    const el = document.createElement("div");
    el.className = "match-item";
    el.textContent = item.text;
    el.dataset.id = item.id;
    if(item.matched) el.classList.add("matched-correct","used");
    if(state._matchSelectedLeft === item.id) el.classList.add("selected");
    el.onclick = () => {
      if(item.matched) return;
      state._matchSelectedLeft = item.id;
      renderMatchCols();
    };
    left.appendChild(el);
  });
  state._matchRight.forEach(item => {
    const el = document.createElement("div");
    el.className = "match-item";
    el.textContent = item.text;
    el.dataset.id = item.id;
    if(item.matched) el.classList.add("matched-correct","used");
    el.onclick = () => {
      if(item.matched || state._matchSelectedLeft === null) return;
      const leftId = state._matchSelectedLeft;
      if(leftId === item.id){
        item.matched = true;
        state._matchLeft.find(l=>l.id===leftId).matched = true;
        state._matchCorrectCount++;
        state._matchSelectedLeft = null;
        renderMatchCols();
        if(state._matchCorrectCount === state._matchTotal){
          finishMatching();
        }
      } else {
        state._matchWrongOnce = true;
        el.classList.add("matched-wrong");
        setTimeout(()=>{ el.classList.remove("matched-wrong"); }, 500);
        state._matchSelectedLeft = null;
        renderMatchCols();
      }
    };
    right.appendChild(el);
  });
}

function finishMatching(){
  state.answered = true;
  if(!state._matchWrongOnce) state.score++;
  const fb = document.getElementById("fb");
  fb.className = "feedback show " + (!state._matchWrongOnce ? "ok" : "bad");
  fb.textContent = !state._matchWrongOnce ? "Perfekt! Alle Paare richtig auf Anhieb zugeordnet." : "Gut gemacht — alle Paare sind jetzt richtig zugeordnet (mit ein paar Versuchen).";
  document.getElementById("nextBtn").disabled = false;
}

/* ---------- TEIL 5: multi-select, 3 correct in order ---------- */
function renderMultiOrdered(round){
  const allOptions = shuffle([...round.correct.map(t=>({text:t,correct:true})), ...round.wrong.map(t=>({text:t,correct:false}))]);
  const main = document.getElementById("main");
  main.innerHTML = `
    ${renderProgressBar()}
    <div class="qcard">
      <span class="thema-tag">${round.thema}</span>
      <p class="qtext">Wähle die drei richtigen Antworten — in der richtigen Reihenfolge (1, 2, 3).</p>
      <div class="ms-grid" id="msGrid"></div>
      <div class="feedback" id="fb"></div>
      <div class="controls" style="margin-top:16px;">
        <button class="btn btn-ghost" id="checkBtn" onclick="checkMultiOrdered()" disabled>Prüfen</button>
        <button class="btn btn-primary" id="nextBtn" disabled onclick="nextRound()">Weiter</button>
      </div>
    </div>
  `;
  state._msOptions = allOptions;
  state._msPicked = [];
  state._msCorrect = round.correct;
  renderMsGrid();
}

function renderMsGrid(){
  const grid = document.getElementById("msGrid");
  grid.innerHTML = "";
  state._msOptions.forEach((opt, idx) => {
    const el = document.createElement("div");
    el.className = "ms-item";
    const pickedIdx = state._msPicked.indexOf(idx);
    if(pickedIdx > -1) el.classList.add("picked");
    el.innerHTML = `<span class="order-badge">${pickedIdx>-1 ? (pickedIdx+1) : ""}</span><span>${opt.text}</span>`;
    el.onclick = () => {
      if(state.answered) return;
      if(pickedIdx > -1){
        state._msPicked.splice(pickedIdx,1);
      } else if(state._msPicked.length < 3){
        state._msPicked.push(idx);
      }
      renderMsGrid();
      document.getElementById("checkBtn").disabled = state._msPicked.length !== 3;
    };
    grid.appendChild(el);
  });
}

function checkMultiOrdered(){
  if(state.answered) return;
  state.answered = true;
  const pickedTexts = state._msPicked.map(i => state._msOptions[i].text);
  const isCorrect = JSON.stringify(pickedTexts) === JSON.stringify(state._msCorrect);
  if(isCorrect) state.score++;
  const items = document.querySelectorAll("#msGrid .ms-item");
  items.forEach((el, idx) => {
    el.classList.add("disabled");
    const pos = state._msCorrect.indexOf(state._msOptions[idx].text);
    const pickedPos = state._msPicked.indexOf(idx);
    if(pos > -1 && pickedPos === pos) el.classList.add("correct");
    else if(pickedPos > -1) el.classList.add("wrong");
  });
  const fb = document.getElementById("fb");
  fb.className = "feedback show " + (isCorrect ? "ok" : "bad");
  fb.textContent = isCorrect ? "Richtig! Reihenfolge und Auswahl stimmen." : "Nicht ganz. Richtige Reihenfolge: " + state._msCorrect.map((t,i)=>(i+1)+". "+t).join(" ");
  document.getElementById("checkBtn").disabled = true;
  document.getElementById("nextBtn").disabled = false;
}

/* =========================================================
   INIT
========================================================= */
renderTabs();
renderHome();
</script>
